<section *ngFor="let order of ordersResponse">
    <h3>Order N°{{ order.orderId }}</h3>
    <div *ngFor="let article of order.articlesEntities">
        <h3>{{ article.title }}</h3>
        <p>{{ article.brand }}</p>
        <p>{{ article.colors }}</p>
        <p>{{ article.size }}</p>
        <p>{{ article.price }}</p>
        <img [src]="article.pictures[0]" [alt]="article.title" width="100px" height="100px"/>
    </div>
    <p>Total: {{ order.total }}</p>
</section>
