<app-header></app-header>
<main>
    <article class="article">
        <section class="article__formSection">
            <h2 class="article__formSection__heading">Login</h2>
            <h3 *ngIf="errorsMsg">{{ errorsMsg }}</h3>
            <form (ngSubmit)="loginUser()" class="luxury-form">
                <div class="form-group">
                    <label for="emailOrUsername">Email or Username:</label>
                    <input
                        type="text"
                        name="emailOrUsername"
                        id="emailOrUsername"
                        placeholder="Please enter your email or username"
                        [(ngModel)]="loginData.emailOrUsername"
                        (blur)="emailOrUsernameVerification()"
                        autocomplete="off"
                        required
                        class="luxury-input"
                    >
                </div>
            
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Please enter your password"
                        [(ngModel)]="loginData.password"
                        (blur)="passwordVerification()"
                        autocomplete="off"
                        required
                        class="luxury-input"
                    >
                </div>
            
                <button type="submit" class="auth-btn login">
                    <span class="auth-text">Log in</span>
                    <span class="auth-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                          <path 
                            d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"
                            fill="currentColor"
                          />
                        </svg>
                    </span>
                </button>
            </form>
        </section>
    </article>
</main>
