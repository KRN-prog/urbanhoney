<app-header></app-header>
<main>
    <article>
        <div *ngIf="pageLoading">
            <h2>Loading...</h2>
        </div>

        <div *ngIf="pageLoading === false">
            <section>
                <h2>Get all users :</h2>
                <div *ngFor="let user of users">
                    <img [src]="user.profile_picture" alt="" width="100px" height="100px">
                    <span>Mail: {{ user.email }}</span>
                    <span>Username: {{ user.username }}</span>
                    <span>Admin {{ user.is_admin }}</span>
                    <span *ngIf="user.is_admin == true">
                        <button (click)="revokeAdminStatus(user.id)">Revoke admin status</button>
                    </span>
                    <span *ngIf="user.is_admin == false">
                        <button (click)="setAdminStatus(user.id)">Set to Admin</button>
                    </span>
                </div>
            </section>

            <section>
                <h2>Get all articles :</h2>
                <div *ngFor="let article of articles">
                    <img [src]="article.pictures[0]" alt="" width="100px" height="100px">
                    <span>{{ article.title }}</span>
                    <span>{{ article.size }}</span>
                    <span>{{ article.price }}</span>
                </div>
            </section>

            <section>
                <h2>Create new article :</h2>
                <form [formGroup]="newArticleForm">
                    <div>
                        <label for="title">Title*</label>
                        <input type="text" formControlName="title" id="title" name="title" placeholder="Pull pour homme..." required/>
                    </div>
                    <div>
                        <label for="description">Description*</label>
                        <textarea name="description" formControlName="description" id="description" placeholder="Description of the article"></textarea>
                    </div>
                    <div formGroupName="category">
                        <label for="categorie">Category*</label>
                        <select name="categorie" id="categorie" formControlName="main" (change)="onCategoryChange($event)">
                            <option *ngFor="let category of categories" [value]="category.category_name">{{ category.category_name }}</option>
                        </select>
                    </div>
                    <div formGroupName="category">
                        <label for="subCategorie">Sub category*</label>
                        <select name="subCategorie" id="categorie" formControlName="sub">
                            <option *ngFor="let subCategory of subCategoryResponse" [value]="subCategory.sub_category_name">{{ subCategory.sub_category_name }}</option>
                        </select>
                    </div>
                    <div>
                        <label for="sexe">Sexe*</label>
                        <select name="" id="" *ngIf="verifySexe('F') == 'F' ">
                            <option value="f">Female</option>
                        </select>

                        <select name="" id="" *ngIf="verifySexe('H') == 'H' ">
                            <option value="m">Male</option>
                        </select>

                        <select name="" id="" *ngIf="verifySexe('H/F') == 'H/F' ">
                            <option value="h/f">Male/Female</option>
                            <option value="h/f">Male</option>
                            <option value="h/f">Female</option>
                        </select>
                    </div>
                    <div>
                        <label for="brand">Brand*</label>
                        <input type="text" id="brand" name="brand" formControlName="brand" placeholder="Nike, Adidas, Puma" required/>
                    </div>
                    <div>
                        <label for="price">Price*</label>
                        <input type="number" id="price" name="price" formControlName="price" placeholder="12.99, 29.99" required/>
                    </div>
                    <div>
                        <label for="images">Images*</label>
                        <textarea name="images" id="images" formControlName="images" placeholder="URL for all article image"></textarea>
                    </div>
                    <div formGroupName="specifications">
                        <label for="color">Color*</label>
                        <textarea name="color" formControlName="color" id="color" placeholder="#FFFFFF, #000000, #A1A1A1, ..."></textarea>
                    </div>
                    <div formGroupName="specifications">
                        <label>Size*</label>
                        <div formArrayName="size">
                            <div *ngFor="let sizeControl of sizes.controls; let i = index">
                                <input [formControlName]="i" type="checkbox"> {{ availableSizes[i] }}
                            </div>
                        </div>
                    </div>
                    <div formGroupName="specifications">
                        <label for="composition">Composition*</label>
                        <textarea name="composition" formControlName="composition" id="composition" placeholder="Composition of the clothe"></textarea>
                    </div>
                    <div formGroupName="specifications">
                        <label for="entretien">Entretien*</label>
                        <textarea name="entretien" formControlName="entretien" id="entretien" placeholder="Entretien of the clothe"></textarea>
                    </div>

                    <button (click)="addArticle()">Add article</button>
                </form>
            </section>
        </div>
    </article>
</main>
